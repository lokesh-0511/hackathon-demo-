<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>College Cultural Fest</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>SRK FEST 2027
        </h1>

        <nav>
            <a href="#home">Home</a>
            <a href="#events">Events</a>
            <a href="#register">Register</a>
        </nav>
    </header>

    <section id="home">

        <h2>Welcome to Our Cultural Fest</h2>

        <p>Celebrate Talent. Experience Culture.</p>

        <button onclick="goToRegister()">
            Register Now
        </button>

    </section>

    <section id="events">

        <h2>Our Events</h2>

        <div class="event">
            <h3>Dance</h3>
            <p>Show your dancing talent.</p>
        </div>

        <div class="event">
            <h3>Singing</h3>
            <p>Showcase your voice.</p>
        </div>

        <div class="event">
            <h3>Photography</h3>
            <p>Capture beautiful moments.</p>
        </div>

    </section>

    <section id="register">

        <h2>Student Registration</h2>

        
<form id="registrationForm">

    <input type="text" placeholder="Student Name" required>

    <input type="text" placeholder="Roll Number" required>

    <select id="branch" required>
        <option value="">Select Your Branch</option>
        <option>CSE</option>
        <option>IT</option>
        <option>ECE</option>
        <option>EEE</option>
        <option>Mechanical</option>
        <option>Civil</option>
        <option>AIML</option>
        <option>Data Science</option>
        <option>Other</option>
    </select>

    <input type="tel" placeholder="Phone Number" required>

    <input type="email" placeholder="Email ID" required>

    <select required>
        <option value="">Select Event</option>
        <option>Dance</option>
        <option>Singing</option>
        <option>Photography</option>
    </select>

    <button type="submit">Register</button>

</form>

    </section>

    <script src="script.js"></script>
</body>
</html>
